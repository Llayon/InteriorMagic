name: Quality and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Test catalog
        run: npm run test:catalog
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck E2E
        run: npm run typecheck:e2e
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e-chromium:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-planner:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run planner fixture browser tests
        run: npm run test:e2e:planner
      - name: Run real planner integration browser tests
        run: npm run test:e2e:planner-real
      - name: Run planning intent integration browser tests
        run: npm run test:e2e:planner-intent
      - name: Upload planner Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-planner-artifacts
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  ar0-evidence:
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR head for AR0 evidence
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify immutable AR0 revision
        run: npm run assets:ar0:verify
      - name: Run AR0 browser evidence
        run: npm run test:e2e:ar0
      - name: Upload AR0 Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-ar0-artifacts
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  build-pages:
    if: github.event_name != 'pull_request'
    needs: [e2e-chromium, e2e-planner]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Build Pages
        run: npm run build
        env:
          VITE_BASE_PATH: /InteriorMagic/
          VITE_ITHAPPY_REMOTE_PREVIEW_ENABLED: "true"
          VITE_ITHAPPY_ASSET_ORIGIN: https://pub-6db83428342a40f7842dae4a7e41b009.r2.dev/catalog/v1/
          VITE_ITHAPPY_PREVIEW_PLACEMENT_URL: https://pub-6db83428342a40f7842dae4a7e41b009.r2.dev/preview/v1/prototype-placement.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
